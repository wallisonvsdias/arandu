<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arandu</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.15);
      --highlight: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--highlight);
      line-height: 1.2;
      display: block;
      margin-bottom: 3px;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .info-box {
      background-color: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🌿</span>
      <h1>Arandu</h1>
    </div>
    <span class="badge-status">
      <span class="dot"></span>
      Ativo
    </span>
  </header>

  <section class="grid-stats">
    <div class="card">
      <span id="active-today" class="metric-value">0 min</span>
      <span class="metric-label">Uso Ativo Hoje</span>
    </div>
    <div class="card">
      <span id="blocked-count" class="metric-value">0</span>
      <span class="metric-label">Gatilhos Barrados</span>
    </div>
  </section>

  <div class="info-box">
    <span>🛡️</span>
    <span>Sessão intencional sem feeds predatórios.</span>
  </div>

  <button id="btn-open-dashboard" style="
    width: 100%;
    margin-bottom: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    color: #38bdf8;
    padding: 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  ">
    📊 Abrir Dashboard Completo
  </button>
  
  <footer>
    <span>Modo Local-First • Zero Rastreio</span>
  </footer>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
