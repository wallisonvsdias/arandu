<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arandu • Painel de Controlo</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --highlight: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 32px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 22px; font-weight: 700; }
    .brand span { font-size: 20px; }

    .actions { display: flex; gap: 8px; }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    button:hover { background: #1e293b; }
    button.primary { background: var(--accent); color: #052e16; font-weight: 600; border: none; }
    button.primary:hover { background: #059669; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .card-value { font-size: 28px; font-weight: 700; color: var(--highlight); }

    .chart-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
    }

    .chart-header { margin-bottom: 16px; font-size: 15px; font-weight: 600; }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      height: 140px;
      gap: 12px;
      padding-top: 10px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      max-width: 36px;
      background: #0284c7;
      border-radius: 4px 4px 0 0;
      transition: height 0.3s ease;
      min-height: 4px;
    }

    .bar-label { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .bar-val { font-size: 10px; color: var(--text); margin-bottom: 4px; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🌿</span>
      <h1>Arandu • Métricas e Histórico</h1>
    </div>
    <div class="actions">
      <button id="btn-export">⬇️ Exportar JSON</button>
      <button id="btn-import-trigger">⬆️ Importar Backup</button>
      <input type="file" id="file-import" accept=".json" />
    </div>
  </header>

  <section class="metrics-grid">
    <div class="card">
      <div class="card-title">Armadilhas Bloqueadas</div>
      <div id="metric-blocked" class="card-value">0</div>
    </div>
    <div class="card">
      <div class="card-title">Uso Ativo Hoje</div>
      <div id="metric-active-today" class="card-value">0 min</div>
    </div>
    <div class="card">
      <div class="card-title">Uso Médio Diário (7d)</div>
      <div id="metric-avg-daily" class="card-value">0 min</div>
    </div>
  </section>

  <section class="chart-section">
    <div class="chart-header">Tempo Ativo nos Últimos 7 Dias (Minutos)</div>
    <div id="chart-container" class="chart-bars">
      <!-- Barras renderizadas dinamicamente via TypeScript -->
    </div>
  </section>

  <script type="module" src="./dashboard.ts"></script>
</body>
</html>
